# Local dev / smoke-test stack: app + MySQL, no AWS needed.
# Usage:
#   docker compose up --build
#   open http://localhost:8080/
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: skillexchange
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://db:3306/skillexchange?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: "root"
      DB_PASSWORD: "password"

volumes:
  db_data:
